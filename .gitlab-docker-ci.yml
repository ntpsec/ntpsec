.build_template:
  variables:
    # Try to save some time by only grabbing the most recent commit
    GIT_DEPTH: '1'
  stage: build
  image: docker
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $CI_REGISTRY_IMAGE/$DISTRO:latest || true
    - >
      docker build
      --pull
      --cache-from $CI_REGISTRY_IMAGE/$DISTRO:latest
      --rm=false
      --tag $CI_REGISTRY_IMAGE/$DISTRO:latest .
      --file .dockerfiles/$DISTRO
    - docker push $CI_REGISTRY_IMAGE/$DISTRO:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

build-image:
  extends: .build_template
  parallel:
    matrix:
      - DISTRO: [
          alpine,
          alpine-pages,
          alpine-seccomp,
          centos-latest,
          clang,
          coverity,
          debian-oldstable,
          debian-stable,
          debian-stable-i386,
          debian-stable-mdns,
          debian-testing,
          fedora-latest,
          gentoo,
          opensuse-leap,
          python3,
          quality-checks,
          rocky,
          ubuntu-latest,
          ubuntu-rolling,
        ]

build-image-unstable:
  extends: .build_template
  allow_failure: true
  parallel:
    matrix:
      - DISTRO: [
          alpine-edge,
          cross-armhf,
          debian-unstable,
          ubuntu-devel,
        ]
